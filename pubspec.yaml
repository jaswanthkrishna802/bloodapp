name: smart_blood
description: AI-Powered Smart Blood Donation and Emergency Donor Matching System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # 🔥 Firebase (LATEST STABLE MATCHED)
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_messaging: ^16.1.2
  firebase_storage: ^13.1.0

  # 📍 Location (FIXED COMPATIBLE)
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # 🧠 State Management
  provider: ^6.1.5+1

  # 🌐 Network
  http: ^1.6.0

  # 💾 Local Storage
  shared_preferences: ^2.5.4

  # 🧰 Utilities
  intl: ^0.20.2
  percent_indicator: ^4.2.5
  uuid: ^4.5.3
  collection: ^1.18.0

  # 📊 Charts
  fl_chart: ^1.2.0

  # 🎨 UI
  google_fonts: ^8.0.2

  # 🔔 Notifications
  flutter_local_notifications: ^21.0.0

  # 📞 Call / URL (NEW - IMPORTANT)
  url_launcher: ^6.3.0

  # 🗺️ Google Maps (OPTIONAL - NEXT LEVEL)
  google_maps_flutter: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # flutter_launcher_icons requires this to be at least 21


flutter:
  uses-material-design: true
  assets:
    - assets/icon/