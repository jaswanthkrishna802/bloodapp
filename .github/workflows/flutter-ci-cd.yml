name: Blood App CI/CD - E2E Master Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ────────────────────────────────────────────────────────
  # STAGE 1: WEB E2E (Node.js Selenium)
  # ────────────────────────────────────────────────────────
  web-e2e-tests:
    name: Web Selenium Tests (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Selenium & Reporting Deps
        run: |
          cd testing/web
          npm install

      - name: Run Web E2E Suite
        run: |
          cd testing/web
          npm test
        continue-on-error: true

      - name: Upload Web Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: web-test-report-xlsx
          path: testing/report_web.xlsx

  # ────────────────────────────────────────────────────────
  # STAGE 2: MOBILE E2E (Python Appium)
  # ────────────────────────────────────────────────────────
  mobile-e2e-tests:
    name: Mobile Appium Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Deps
        run: pip install -r testing/requirements.txt

      - name: Run Mobile E2E Suite
        run: |
          pytest testing/mobile/test_mobile_login.py
        continue-on-error: true

      - name: Upload Mobile Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-report-xlsx
          path: testing/report_mobile.xlsx

  # ────────────────────────────────────────────────────────
  # STAGE 3: FLUTTER BUILD & DEPLOY
  # ────────────────────────────────────────────────────────
  deploy-web:
    name: Build & Deploy Flutter Web
    needs: [web-e2e-tests, mobile-e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Deps
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/bloodapp/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
