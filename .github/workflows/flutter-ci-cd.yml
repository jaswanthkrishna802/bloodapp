name: Flutter Selenium E2E + Deploy

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Selenium Web Tests against GitHub Pages
  # ─────────────────────────────────────────────
  selenium-web-tests:
    name: Selenium Web E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Test Dependencies
        run: pip install -r testing/requirements.txt

      - name: Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Run Selenium Tests (Web)
        run: pytest testing/web/ --html=testing/web/report.html
        continue-on-error: true

      - name: Upload Web Test Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: selenium-web-report
          path: testing/web/report.html

  # ─────────────────────────────────────────────
  # JOB 2: Build Flutter Web and Deploy to Pages
  # ─────────────────────────────────────────────
  build-and-deploy:
    name: Build Flutter Web + Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: selenium-web-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/bloodapp/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
