name: Python Selenium E2E Tests

on:
  push:
    branches:
      - main

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r testing/requirements.txt

      - name: Start Flutter Web App in Background
        # You'll need Flutter installed on runner if you are hosting it locally
        run: |
          # Assuming you have a deployed URL already or you build & serve Flutter here.
          # Example:
          # flutter pub get
          # flutter run -d web-server --web-port 8080 &
          echo "Starting app..."

      - name: Run Selenium PyTest
        run: |
          cd testing
          pytest tests/ --html=report.html

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: selenium-report
          path: testing/report.html
